# 每次推送 main 與每個 PR 自動跑 check_repo 與既有測試（1.2.42 ADR-065 加 PR 觸發與測試步驟；1.2.44 ADR-067 回測 PAUSED_BY_USER 期間帶 --skip-backtest 略過 C6、C9，印 NOT_RUN 不印 PASS，MIKO 明說恢復回測後拿掉這個參數；1.2.51 ADR-074 取代這個方向：MIKO 2026-11-09 決策 C6、C9 是固定樣本的引擎回歸檢查、不算違反回測暫停，CI 不再帶 --skip-backtest；含 C11 Skill 保真：比對推送前版本；C3／C12 私密字用 repo Secret MIKO_PRIVATE_WORDS，未設定時只做格式檢查；C13 擋本機設定、環境變數、憑證檔與金鑰樣式）
name: check_repo
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install openpyxl
      - name: check_repo
        env:
          MIKO_PRIVATE_WORDS: ${{ secrets.MIKO_PRIVATE_WORDS }}
          MIKO_BASE: ${{ github.event.before }}
        run: |
          if ! git cat-file -e "$MIKO_BASE^{commit}" 2>/dev/null; then export MIKO_BASE=HEAD~1; fi
          python3 -I -B tests/check_repo.py
      - name: miko-core terms_check 測試（21 題，1.2.53 ADR-076）
        if: always()
        run: python3 -I -B skills/miko-core/scripts/test_terms_check.py
      - name: miko-core flowlock_check 測試（27 題，1.2.64 ADR-087）
        if: always()
        run: python3 -I -B skills/miko-core/scripts/test_flowlock_check.py
      - name: make-skill skill_lint 測試（14 題）
        if: always()
        run: python3 -I -B skills/make-skill/scripts/test_skill_lint.py
      - name: dghp-travel scripts 測試（45 項，ADR-037）
        if: always()
        working-directory: skills/dghp-travel/scripts
        run: python3 -I -B -m unittest discover -s tests
      - name: ffmpeg 套件快取還原（apt 套件庫不可用時不再依賴它；快取鍵含 runner 映像版本）
        id: ffcache
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: ~/ffdebs
          key: ffmpeg-debs-${{ runner.os }}-${{ env.ImageVersion }}
      - name: visual-content-intelligence 與 read_ledger 程式測試（1.2.46 ADR-069；ffmpeg 優先用快取的 .deb 離線安裝，沒有快取才走 apt；都失敗標 NOT_RUN 不判紅，MIKO 2026-11-11 放寬；ffmpeg 已裝時 test_vci 失敗照樣紅，結束碼 5 照樣紅）
        if: always()
        timeout-minutes: 8
        run: |
          APT="-o Acquire::http::Timeout=10 -o Acquire::Retries=2"
          mkdir -p ~/ffdebs
          SRC=none
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then SRC=preinstalled
          elif ls ~/ffdebs/*.deb >/dev/null 2>&1 && sudo dpkg -i ~/ffdebs/*.deb >/dev/null 2>&1 && command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then SRC=cache
          elif timeout 150 sudo apt-get $APT update -qq && timeout 200 sudo apt-get $APT install -y -qq --download-only ffmpeg && cp /var/cache/apt/archives/*.deb ~/ffdebs/ && timeout 100 sudo apt-get $APT install -y -qq ffmpeg && command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then SRC=apt; fi
          echo "ffmpeg 來源：$SRC"
          echo "FF_SRC=$SRC" >> "$GITHUB_ENV"
          if [ "$SRC" != none ]; then
            python3 -I -B -W ignore skills/visual-content-intelligence/scripts/test_vci.py
          else
            echo "::warning title=NOT_RUN::ffmpeg 無預裝、無快取、apt 失敗或逾時，visual-content-intelligence 測試 NOT_RUN（不是 PASS）"
            {
              echo "## ⚠️ NOT_RUN：visual-content-intelligence／read_ledger 測試"
              echo "ffmpeg 無預裝、無快取、apt 安裝也失敗或逾時，此步沒有執行測試，**不是 PASS**。其餘步驟照常。恢復後請重跑 CI。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: ffmpeg 套件快取儲存（只在 apt 路徑成功、且無既有快取時存）
        if: always() && env.FF_SRC == 'apt' && steps.ffcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/ffdebs
          key: ffmpeg-debs-${{ runner.os }}-${{ env.ImageVersion }}
      - name: photo-inspection-log 程式冒煙測試
        if: always()
        run: python3 -I -B tests/test_photo_scripts.py
      - name: photo-inspection-log 照片專案自己的測試（scripts/tests 存在時才跑）
        if: always()
        run: |
          if [ -d skills/photo-inspection-log/scripts/tests ]; then cd skills/photo-inspection-log/scripts && python3 -I -B -m unittest discover -s tests; else echo "scripts/tests 尚未建立，略過"; fi
